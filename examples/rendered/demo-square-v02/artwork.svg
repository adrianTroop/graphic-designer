<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>Studio Demo / square-card</title><desc>Draft artwork. Each configured layer remains separate; source raster images retain their original format.</desc><g id="background"><rect width="1080" height="1080" fill="#F4F4EE"/></g>
<g id="accent-rule"><rect x="70" y="150" width="940" height="8" rx="0" fill="#C5E86C" stroke="none" stroke-width="1" opacity="1"/></g>
<g id="eyebrow" data-component="editable-text"><text font-family="sans-serif" font-size="26" font-weight="400" fill="#202822" text-anchor="start" direction="ltr"><tspan x="70" y="86">STUDIO DEMO / A SIMPLE MESSAGE</tspan></text></g>
<g id="headline" data-component="editable-text"><text font-family="sans-serif" font-size="92" font-weight="700" fill="#202822" text-anchor="start" direction="ltr"><tspan x="70" y="322">Start with</tspan><tspan x="70" y="432.4">something clear.</tspan></text></g>
<g id="body" data-component="editable-text"><text font-family="sans-serif" font-size="32" font-weight="400" fill="#202822" text-anchor="start" direction="ltr"><tspan x="70" y="572">A headline, a useful detail and a next step. Every layer is yours</tspan><tspan x="70" y="610.4">to shape.</tspan></text></g>
<g id="details" data-component="editable-text"><text font-family="sans-serif" font-size="26" font-weight="400" fill="#202822" text-anchor="start" direction="ltr"><tspan x="70" y="786">Neutral demonstration · 1080 × 1080</tspan></text></g>
<g id="cta-panel"><rect x="70" y="910" width="940" height="95" rx="12" fill="#C5E86C" stroke="none" stroke-width="1" opacity="1"/></g>
<g id="cta" data-component="editable-text"><text font-family="sans-serif" font-size="30" font-weight="700" fill="#202822" text-anchor="start" direction="ltr"><tspan x="100" y="966">Built around your brief.</tspan></text></g>
<g id="review-label-background"><rect x="780" y="55" width="230" height="40" fill="#202822"/></g>
<g id="review-label" data-component="editable-text"><text font-family="sans-serif" font-size="18" font-weight="400" fill="#F4F4EE" text-anchor="middle" direction="ltr"><tspan x="895" y="82.2">DESIGN SAMPLE</tspan></text></g></svg>