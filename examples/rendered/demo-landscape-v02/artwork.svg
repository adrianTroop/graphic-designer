<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Studio Demo / landscape</title><desc>Draft artwork. Each configured layer remains separate; source raster images retain their original format.</desc><g id="background"><rect width="1600" height="900" fill="#202822"/></g>
<g id="accent-rule"><rect x="80" y="160" width="90" height="8" rx="0" fill="#C5E86C" stroke="none" stroke-width="1" opacity="1"/></g>
<g id="eyebrow" data-component="editable-text"><text font-family="sans-serif" font-size="28" font-weight="400" fill="#F4F4EE" text-anchor="start" direction="ltr"><tspan x="80" y="88">STUDIO DEMO / FLEXIBLE BY DESIGN</tspan></text></g>
<g id="headline" data-component="editable-text"><text font-family="sans-serif" font-size="90" font-weight="700" fill="#F4F4EE" text-anchor="start" direction="ltr"><tspan x="80" y="315">One engine. Your visual system.</tspan></text></g>
<g id="body" data-component="editable-text"><text font-family="sans-serif" font-size="36" font-weight="400" fill="#F4F4EE" text-anchor="start" direction="ltr"><tspan x="80" y="526">Choose the format. Define the fields. Set the type, colour and spacing in your brand</tspan><tspan x="80" y="569.2">package.</tspan></text></g>
<g id="details" data-component="editable-text"><text font-family="sans-serif" font-size="28" font-weight="400" fill="#F4F4EE" text-anchor="start" direction="ltr"><tspan x="80" y="678">Independent of any client, venue or industry.</tspan></text></g>
<g id="cta-panel"><rect x="80" y="770" width="1100" height="82" rx="12" fill="#C5E86C" stroke="none" stroke-width="1" opacity="1"/></g>
<g id="cta" data-component="editable-text"><text font-family="sans-serif" font-size="30" font-weight="700" fill="#202822" text-anchor="start" direction="ltr"><tspan x="110" y="817">Create once. Adapt with purpose.</tspan></text></g>
<g id="review-label-background"><rect x="1290" y="60" width="230" height="40" fill="#202822"/></g>
<g id="review-label" data-component="editable-text"><text font-family="sans-serif" font-size="18" font-weight="400" fill="#F4F4EE" text-anchor="middle" direction="ltr"><tspan x="1405" y="87.2">DESIGN SAMPLE</tspan></text></g></svg>